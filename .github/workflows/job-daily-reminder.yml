name: Job Board Daily Reminder (18:08 HKT)
on:
  schedule:
    - cron: '8 10 * * *'   # 每日 UTC 10:08 = HKT 18:08
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open daily job-board reminder issue (dedup by date)
        uses: actions/github-script@v7
        with:
          script: |
            // HKT 日期（UTC+8）
            const hkt = new Date(Date.now() + 8 * 3600e3);
            const today = hkt.toISOString().slice(0, 10);
            const { owner, repo } = context.repo;

            // 当日防重复：查已有 open issue（label=reminder），标题含今日日期则跳过
            const { data: existing } = await github.rest.issues.listForRepo({
              owner, repo,
              state: 'open',
              labels: 'reminder',
              per_page: 100
            });
            const dup = existing.find(i => i.title.includes(today));
            if (dup) {
              console.log(`⚠️ 今日提醒已存在 (#${dup.number})，跳过创建`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              owner, repo,
              title: `🆕 就业看板每日更新 · ${today}`,
              labels: ['ops', 'career', 'reminder'],
              body: [
                '## 值班任务（每日 18:08）',
                '1. 按 `ima-materials/career-daily-update.md` SOP 扫描渠道变化（岗位热度/开招停招/薪资），只记变化。',
                '2. 过期/失效投递从 `wiki-site/data/job-postings.json` 移除；新增有效投递补充。',
                '3. 跑 `ima-materials/update-career-trends.cjs` / `ima-materials/update-job-postings.cjs` 落盘 → 校验（涉及词条则 `wiki-site/scripts/validate-entries.py`）→ git push；完成后在本 Issue 留言。'
              ].join('\n')
            });
            console.log(`✅ 已创建提醒 Issue #${issue.number}`);
