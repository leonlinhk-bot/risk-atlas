<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'" />
  <title>知识宇宙 · Risk Atlas · 风险图谱</title>
  <link rel="stylesheet" href="css/style.css?v=7580d06f" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <div class="identity-strip"><span class="identity-text">Lingnan University · Risk, Insurance and Actuarial Analysis</span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span class="brand-text"><b>Risk Atlas · 风险图谱</b><small>岭南大学 · MScRIAA（原 MSc RIM）· AI 赋能风险、保险与精算</small></span>
      </a>
      <nav class="nav" id="site-nav"></nav>
    </div>
  </header>

  <main class="container" id="main-content">
    <h1 class="page-title">知识宇宙</h1>
    <p class="page-sub">五条纵深线为骨干，课程 ↔ 概念 ↔ 工具 ↔ 框架相互咬合。拖拽节点、滚轮缩放、点击节点进入词条。</p>
    <div class="legend">
      <span class="lg"><span class="dot" style="background:#14356a"></span>课程</span>
      <span class="lg"><span class="dot" style="background:#c9a227"></span>概念</span>
      <span class="lg"><span class="dot" style="background:#2e8b57"></span>工具</span>
      <span class="lg"><span class="dot" style="background:#8e44ad"></span>框架</span>
      <span class="lg"><span class="dot" style="background:#d9534f"></span>纵深线</span>
      <span class="lg"><span class="dot" style="background:#0e7490"></span>考牌</span>
      <span class="lg"><span class="dot" style="background:#b45309"></span>岗位</span>
      <span class="lg"><span class="dot" style="background:#1d4ed8"></span>雇主</span>
      <span class="lg"><span class="dot" style="background:#7c3aed"></span>渠道</span>
      <span class="lg"><span class="dot" style="background:#0d9488"></span>资源</span>
    </div>
    <div class="gctl">
      <div class="gctl-row" role="group" aria-label="显示规模">
        <span class="gctl-lab">显示规模</span>
        <button class="gc-btn" data-limit="120" aria-pressed="false">核心 120</button>
        <button class="gc-btn active" data-limit="300" aria-pressed="true">300</button>
        <button class="gc-btn" data-limit="0" aria-pressed="false">全部（较慢）</button>
      </div>
      <div class="gctl-row" role="group" aria-label="类型筛选">
        <span class="gctl-lab">类型筛选</span>
        <button class="gc-btn gt-btn active" data-type="all" aria-pressed="true">全部</button>
        <button class="gc-btn gt-btn" data-type="course" aria-pressed="false">课程</button>
        <button class="gc-btn gt-btn" data-type="concept" aria-pressed="false">概念</button>
        <button class="gc-btn gt-btn" data-type="tool" aria-pressed="false">工具</button>
        <button class="gc-btn gt-btn" data-type="framework" aria-pressed="false">框架</button>
        <button class="gc-btn gt-btn" data-type="track" aria-pressed="false">纵深线</button>
        <button class="gc-btn gt-btn" data-type="credential" aria-pressed="false">考牌</button>
        <button class="gc-btn gt-btn" data-type="job" aria-pressed="false">岗位</button>
        <button class="gc-btn gt-btn" data-type="employer" aria-pressed="false">雇主</button>
        <button class="gc-btn gt-btn" data-type="channel" aria-pressed="false">渠道</button>
        <button class="gc-btn gt-btn" data-type="resource" aria-pressed="false">资源</button>
      </div>
      <div class="gctl-stat muted" id="gstat">加载中…</div>
    </div>
    <div id="graph" aria-label="知识宇宙：词条互链可视化（点击节点进入词条）"></div>
  </main>

  <footer class="footer">
    <span>© <b class="lingnan">Lingnan University</b></span> ·
    <span>Risk Atlas · 风险图谱</span> ·
    <span class="muted">纯静态 · 双链驱动</span>
  </footer>

  <script src="js/vendor/echarts.min.js?v=42f8329d"></script>
  <script src="js/nav.js?v=330b2eed"></script>
  <script src="js/wiki.js?v=25f80e49"></script>
  <script src="js/notice.js?v=aac6b809"></script>
  <script src="js/graph.js?v=f5568d70"></script>
  <script>
    Wiki.attachLangSwitcher(document.getElementById('lang-switch'));
    var gd = null, gLimit = 300, gTypes = [];
    function draw() {
      var el = document.getElementById('graph');
      var s = Graph.renderData(gd, el, { limit: gLimit, types: gTypes });
      document.getElementById('gstat').textContent =
        '已显示 ' + s.shown + ' / ' + s.total + ' 个词条 · ' + s.links.length + ' 条连线' +
        (gLimit ? '（按连接度取 top-' + gLimit + '，切换「全部」可看完整网络）' : '（全量渲染，首次布局较慢）');
    }
    Wiki.loadGraph().then(function (g) {
      gd = g;
      draw();
      document.querySelector('.gctl').addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.gc-btn') : null;
        if (!btn) return;
        if (btn.hasAttribute('data-limit')) {
          gLimit = parseInt(btn.getAttribute('data-limit'), 10) || 0;
          Array.prototype.forEach.call(document.querySelectorAll('.gc-btn[data-limit]'), function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
          btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
          draw();
        } else if (btn.hasAttribute('data-type')) {
          var t = btn.getAttribute('data-type');
          Array.prototype.forEach.call(document.querySelectorAll('.gt-btn'), function (x) { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
          btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
          gTypes = (t === 'all') ? [] : [t];
          draw();
        }
      });
    }).catch(function (err) {
      var el = document.getElementById('graph');
      el.classList.add('graph-fallback');
      el.style.display = 'block';
      el.innerHTML = '<p class="muted">加载失败：' + Wiki.escapeHtml(err.message) + '</p>';
    });
  </script>
</body>
</html>
