<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'" />
  <title>分类索引 · Risk Atlas · 风险图谱</title>
  <link rel="stylesheet" href="css/style.css?v=fb6785e2" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <div class="identity-strip"><span class="identity-text">Lingnan University · Risk, Insurance and Actuarial Analysis</span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span class="brand-text"><b>Risk Atlas · 风险图谱</b><small>岭南大学 · MScRIAA（原 MSc RIM）· AI 赋能风险、保险与精算</small></span>
      </a>
      <nav class="nav" id="site-nav"></nav>
    </div>
  </header>

  <main class="container" id="main-content">
    <h1 class="page-title">分类索引</h1>
    <p class="page-sub">按十类词条浏览全部内容：课程 / 概念 / 工具 / 框架 / 纵深线 / 考牌 / 岗位 / 雇主 / 渠道 / 资源（实测网站并入「工具·AI 工具箱」）。</p>
    <div id="sections"><p class="muted">加载中…</p></div>
  </main>

  <footer class="footer">
    <span>© <b class="lingnan">Lingnan University</b></span> ·
    <span>Risk Atlas · 风险图谱</span> ·
    <span class="muted">纯静态 · 双链驱动</span>
  </footer>

  <script src="js/nav.js?v=330b2eed"></script>
  <script src="js/wiki.js?v=5b9dc51c"></script>
  <script src="js/notice.js?v=06b6a6bc"></script>
  <script>
    (function () {
      Wiki.attachLangSwitcher(document.getElementById('lang-switch'));
      var ORDER = ['course', 'concept', 'tool', 'framework', 'track', 'credential', 'job', 'employer', 'channel', 'resource'];
      var LABEL = { course: '课程', concept: '概念', tool: '工具', framework: '框架', track: '纵深线', credential: '考牌', job: '岗位', employer: '雇主', channel: '渠道', resource: '资源' };

      function tag(d) {
        return '<span class="tag ' + Wiki.tagClass(d.type) + '">' + Wiki.typeLabel(d.type) + '</span>';
      }

      function entryCard(e) {
        var line = e.code || e.en || (e.category ? '类别：' + e.category : '');
        var sub = e.summary || '';
        var badge = '';
        if (e.verified) {
          badge = '<span class="vbadge" title="本站在 Risk Atlas 探索/萃取流程中实测过">本站实测</span>';
        } else if (e.type === 'tool') {
          badge = '<span class="vbadge-muted" title="尚未在本站实测（来源与可用性待验证）">未实测</span>';
        }
        return '<a class="entry-card" href="' + Wiki.entryHref(e.slug) + '">' +
          '<b>' + Wiki.escapeHtml(Wiki.tr(e, 'title')) + '</b> ' + tag(e) + badge +
          (line ? '<small>' + Wiki.escapeHtml(line) + '</small>' : '') +
          '<small>' + Wiki.escapeHtml(sub) + '</small></a>';
      }

      /* 工具区按 AI 工具箱 category 分组；顶部加分类锚点导航（便于在 1300+ 工具中快速定位） */
      function toolSections(list) {
        var byCat = {};
        list.forEach(function (e) { (byCat[e.category || '其他'] = byCat[e.category || '其他'] || []).push(e); });
        var names = Object.keys(byCat).sort(function (a, b) { return byCat[b].length - byCat[a].length; });
        var nav = '<div class="cat-nav" aria-label="工具分类导航">' +
          names.map(function (n, i) {
            return '<a href="#tool-cat-' + i + '">' + Wiki.escapeHtml(n) +
              ' <span class="muted">' + byCat[n].length + '</span></a>';
          }).join('') + '</div>';
        return nav + names.map(function (n, i) {
          return '<div class="tool-group" id="tool-cat-' + i + '"><h3>' + Wiki.escapeHtml(n) +
            ' <span class="muted">(' + byCat[n].length + ')</span></h3>' +
            '<div class="entry-list">' + byCat[n].map(entryCard).join('') + '</div></div>';
        }).join('');
      }

      Wiki.load().then(function (data) {
        var entries = data.entries;
        var groups = {};
        entries.forEach(function (e) { (groups[e.type] = groups[e.type] || []).push(e); });
        var html = '';
        ORDER.forEach(function (t) {
          var list = (t === 'tool') ? (groups['tool'] || []).concat(groups['website'] || []) : (groups[t] || []);
          if (!list.length) return;
          html += '<section class="cat-section" id="type-' + t + '">';
          html += '<h2>' + LABEL[t] + ' <span class="muted">(' + list.length + ')</span></h2>';
          html += t === 'tool'
            ? toolSections(list)
            : '<div class="entry-list">' + list.map(entryCard).join('') + '</div>';
          html += '</section>';
        });
        document.getElementById('sections').innerHTML = html;
        // 支持 #type-xxx 锚点滚动
        if (location.hash) {
          var target = document.querySelector(location.hash);
          if (target) setTimeout(function () { target.scrollIntoView(); }, 0);
        }
      }).catch(function (err) {
        document.getElementById('sections').innerHTML = '<p class="muted">加载失败：' + Wiki.escapeHtml(err.message) + '</p>';
      });
    })();
  </script>
</body>
</html>
